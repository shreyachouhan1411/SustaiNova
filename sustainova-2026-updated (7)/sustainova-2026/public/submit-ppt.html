<body data-page="ppt"><main id="main" class="inner"><div class="wrap narrow">
<header class="page-head"><h1>Submit your PPT</h1><p class="lead">Deadline: <b id="dl"></b></p><p class="count" id="count" aria-live="off"></p></header>
<p id="state" class="msg" hidden role="status"></p>

  <form id="fl" novalidate><div class="fgrid" id="lookup-fields"></div><p id="ml" class="msg" hidden role="alert"></p>

<section id="gate" class="card" hidden><h2 id="gate-t">Not available yet</h2><p id="gate-p"></p><a class="btn btn-ghost" id="gate-a" href="status.html">Check status</a></section>

<section id="upload" class="card" aria-labelledby="u1" hidden><h2 id="u1">Submit your PPT link</h2>
  <p id="current" class="msg ok" hidden></p>
  <form id="fu" novalidate><div id="up-fields"></div><p id="mu" class="msg" hidden role="alert"></p>
  <div class="btn-row"><button class="btn" type="submit" id="sub">Submit PPT</button></div>
